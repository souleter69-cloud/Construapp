<script>

{id:4,n:'Ana Muñoz',e:'Cerámica y revestimientos',c:'Maipú',r:4.2,j:12,k:'Bronce',b:380000,x:24,y:52,d:'Disponible'},
{id:5,n:'Pedro Vidal',e:'Electricidad',c:'Santiago Centro',r:4.6,j:33,k:'Plata',b:260000,x:44,y:40,d:'Urgencias 24 h'},
{id:6,n:'Claudia Fuentes',e:'Arquitectura',c:'Las Condes',r:4.9,j:19,k:'Oro',b:650000,x:82,y:24,d:'Agenda abierta'},
{id:7,n:'Jorge Díaz',e:'Carpintería',c:'San Bernardo',r:4.0,j:8,k:'Bronce',b:340000,x:42,y:84,d:'Disponible'},
{id:8,n:'Constructora Andes',e:'Construcción general',c:'Puente Alto',r:4.4,j:21,k:'Plata',b:900000,x:70,y:84,d:'Empresa'}];
const COM=[...new Set(P.map(p=>p.c))].sort(),ESP=[...new Set(P.map(p=>p.e))].sort();
const MAPSVG=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"><g fill="var(--sf)" stroke="var(--mu)" stroke-opacity=".45" stroke-width="1.5"><polygon points="6,36 34,32 36,60 30,72 8,68"/><polygon points="34,32 52,30 52,50 36,60"/><polygon points="52,28 74,22 74,40 60,40 52,42"/><polygon points="52,42 60,40 74,40 72,56 52,58"/><polygon points="74,12 95,8 96,42 74,40"/><polygon points="52,58 72,56 90,60 88,76 62,76 52,70"/><polygon points="20,76 62,76 60,95 24,94"/><polygon points="62,76 88,76 90,94 60,95"/></g><polygon points="96,4 100,0 100,100 96,96" fill="var(--mu)" fill-opacity=".25"/><ellipse cx="58" cy="33" rx="5" ry="3" fill="#5fae6b" fill-opacity=".55"/><ellipse cx="50" cy="54" rx="40" ry="34" fill="none" stroke="var(--mu)" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M6,52 L36,46 L52,42 L74,34" fill="none" stroke="#d9a400" stroke-opacity=".6" stroke-width="3" stroke-dasharray="8 4"/><path d="M0,44 C16,50 28,34 44,36 S64,28 100,18" fill="none" stroke="#4a90d9" stroke-opacity=".75" stroke-width="4"/></svg>`;
const price=p=>Math.round(p.b*K[p.k]*3/1000)*1000;
const OF=[{p:3,d:12,i:'Materiales de albañilería y retiro de escombros'},{p:1,d:10,i:'Gasfitería completa, sin materiales'},{p:4,d:15,i:'Cerámica y fragüe, materiales incluidos'}];
const HN=[['Demolición y preparación',30],['Instalaciones de agua y electricidad',30],['Revestimientos y artefactos',25],['Terminaciones y entrega',15]];
const LR={cliente:'Cliente',maestro:'Maestro',admin:'Administrador'};
const TABS={cliente:[['buscar','Buscar'],['obra','Mi obra']],maestro:[['o','Oportunidades'],['t','Mi trabajo']],admin:[['p','Perfiles']]};
const D0=()=>({role:'cliente',tab:{cliente:'buscar',maestro:'o',admin:'p'},view:'lista',f:{e:'',c:'',r:0},sel:null,req:'none',acc:null,h:[0,0,0,0],rt:{},uf:(window.UFV||41000),op:{},ad:[],as:{i:{},f:{},h:{}},ph:[],mph:[],q:{},pr:{},job:{t:'',d:'',c:'Ñuñoa',m:''},mp:'',sent:0,opn:0,pk:'ph',contract:0,plazo:0,
PEND:[{n:'Rodrigo Silva',e:'Electricidad',d:'Certificado SEC clase B adjunto'},{n:'Estudio Nova',e:'Arquitectura',d:'Título y patente municipal adjuntos'},{n:'Hugo Araya',e:'Gasfitería',d:'Sin certificado SEC adjunto'}]});
let S=D0(),tt;
const badge=k=>`<span class="b"><i style="background:${KC[k]}"></i>${k}</span>`;
const rate=w=>S.rt[w]?`<p class="on">Calificación enviada: ${S.rt[w]} de 5 ${st(S.rt[w])}</p>`:`<div class="rt" role="group" aria-label="Calificar de 1 a 5">${[1,2,3,4,5].map(v=>`<button data-a="rate" data-w="${w}" data-v="${v}" aria-label="${v} estrellas">★</button>`).join('')}</div>`;
const acc=()=>P.find(p=>p.id==S.acc)||P[2];
const hitos=(who)=>{const tot=S.contract||0;return HN.map((h,i)=>{const s=S.h[i],amt=Math.round(tot*h[1]/100);let a;
 const ao=S.as.h[i]?'<span class="b">Asesoría técnica solicitada</span>':`<button class="btn s" data-a="ash" data-v="${i}">Asesoría técnica (opcional)</button>`;
 if(who=='c')a=s==1?`<button class="btn" data-a="apr" data-v="${i}">Aprobar y registrar pago</button> <button class="btn r" data-a="prob" data-v="${i}">Reportar problema</button> ${ao}`:s==2?'<span class="on">Aprobado · pago registrado</span>':s==3?'<span style="color:var(--wr)">Problema reportado. El maestro debe corregir.</span>':'<span class="mu">Pendiente del maestro</span>';
 else a=s==0||s==3?`<button class="btn" data-a="rep" data-v="${i}" ${(i&&S.h[i-1]!=2)||!iniOk()?'disabled':''}>${s==3?'Corregir y reportar de nuevo':'Reportar avance con fotos'}</button>`:s==1?`<span class="mu">Esperando aprobación del cliente</span> ${ao}`:'<span class="on">Aprobado · pago registrado</span>';
 return `<div class="hit"><div><b>${h[0]}</b><div class="mu">${h[1]}% · ${M(amt)}</div></div>${a}</div>`}).join('')};
const adi=who=>`<h3 style="margin:14px 0 6px">Adicionales de obra</h3>`+(S.ad.length?S.ad.map((x,i)=>`<div class="hit"><div><b>${x.t}</b><div class="mu">${M(x.a)}</div></div>${x.s?'<span class="on">Aceptado por el cliente</span>':who=='c'?`<button class="btn" data-a="aad" data-v="${i}">Aceptar adicional</button>`:'<span class="mu">Esperando al cliente</span>'}</div>`).join(''):'<p class="mu">Sin adicionales. Todo cambio de alcance debe quedar registrado y aceptado.</p>')+(who=='m'?'<button class="btn s" data-a="pad">Proponer adicional: cambio de cañería ($85.000)</button>':'');
const V={cliente:{
buscar(){const f=S.f,L=P.filter(p=>(!f.e||p.e==f.e)&&(!f.c||p.c==f.c)&&p.r>=f.r).sort((a,b)=>b.r-a.r);
 const card=p=>`<div class="c"><div class="row"><h3>${p.n}</h3>${badge(p.k)}</div><div class="mu">${p.e} · ${p.c}</div><div class="mu ok-b" title="Revisado por el equipo: cédula de identidad y certificados (oct. 2026)">${p.id==4||p.id==7?'Verificación pendiente':'✓ Identidad verificada'}</div><div><span class="st">${st(p.r)}</span> ${p.r.toFixed(1)} <span class="mu">(${p.j} trabajos)</span></div><div class="mu">${p.d}</div><div class="row" style="margin-top:8px"><span>Desde <b>${M(Math.round(p.b*K[p.k]))}</b></span><span><button class="btn s" data-a="vis">Visita técnica</button> <button class="btn s" data-a="ped">Cotizar</button></span></div></div>`;
 const sel=P.find(p=>p.id==S.sel);
 const body=S.view=='lista'?`<div class="g3">${L.map(card).join('')||'<p>Sin resultados. Prueba con otros filtros.</p>'}</div>`:
 `<div class="map" role="group" aria-label="Mapa de Santiago">${MAPSVG}${[['Maipú',24,60],['Stgo. Centro',44,48],['Ñuñoa',58,54],['Providencia',66,40],['Las Condes',82,32],['La Florida',74,72],['San Bernardo',42,92],['Puente Alto',70,92]].map(z=>`<span class="z" style="left:${z[1]}%;top:${z[2]}%">${z[0]}</span>`).join('')}<span class="me" style="left:55%;top:50%" title="Tu ubicación"></span>${L.map(p=>`<button class="pin" style="left:${p.x}%;top:${p.y}%" data-a="pin" data-v="${p.id}" aria-pressed="${S.sel==p.id}" aria-label="${p.n}, ${p.e}"></button>`).join('')}</div><p class="mu">Mapa de referencia con comunas, río Mapocho (azul), Alameda (amarillo), anillo Américo Vespucio y cordillera. El punto verde eres tú.</p>${sel&&L.includes(sel)?card(sel):'<p class="mu">Toca un marcador para ver al especialista.</p>'}`;
 return `<div class="hero"><h2>Conectamos proyectos con profesionales de la construcción</h2><p>Publica tu proyecto o busca directo. Recibe propuestas, paga por avance y evalúa solo si contrataste.</p><button class="btn" data-a="ped">Publicar mi proyecto</button></div><div class="chips">${['',...ESP].map(e=>`<button class="chip" data-a="chip" data-v="${e}" aria-pressed="${f.e==e}">${e||'Todas'}</button>`).join('')}</div><p class="mu">Las evaluaciones solo las dejan quienes contrataron en ConstruApp. Ningún plan comercial otorga estrellas ni verificaciones.</p><div class="f"><select data-f="c" aria-label="Comuna"><option value="">Todas las comunas</option>${COM.map(e=>`<option ${f.c==e?'selected':''}>${e}</option>`).join('')}</select><select data-f="r" aria-label="Calificación"><option value="0">Cualquier calificación</option>${[4,4.5].map(v=>`<option value="${v}" ${f.r==v?'selected':''}>${v} o más</option>`).join('')}</select><span class="seg"><button data-a="view" data-v="lista" aria-pressed="${S.view=='lista'}">Lista</button><button data-a="view" data-v="mapa" aria-pressed="${S.view=='mapa'}">Mapa</button></span></div>${body}`},
},
maestro:{},
admin:{p(){return `<h2>Perfiles por validar</h2>${S.PEND.length?S.PEND.map((p,i)=>`<div class="c n"><div class="row"><div><b>${p.n}</b> · ${p.e}<div class="mu">${p.d}</div></div><div><button class="btn" data-a="val" data-v="${i}">Validar</button> <button class="btn r" data-a="rej" data-v="${i}">Rechazar</button></div></div></div>`).join(''):'<p class="mu">No hay perfiles pendientes.</p>'}<p class="mu">Una buena evaluación no reemplaza licencias, títulos ni autorizaciones legales.</p>`}}};
function R(){$('#roles').innerHTML=Object.keys(LR).map(r=>`<button data-a="role" data-v="${r}" aria-pressed="${S.role==r}">${LR[r]}</button>`).join('');
 const T=TABS[S.role];$('#tabs').innerHTML=T.length>1?T.map(t=>`<button data-a="tab" data-v="${t[0]}" aria-pressed="${S.tab[S.role]==t[0]}">${t[1]}</button>`).join(''):'';$('#tabs').style.display=T.length>1?'flex':'none';
 $('#main').innerHTML=V[S.role][S.tab[S.role]]()}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='role')S.role=v;else if(a=='tab')S.tab[S.role]=v;else if(a=='view')S.view=v;else if(a=='pin')S.sel=+v;
 else if(a=='ped'){S.role='cliente';S.tab.cliente='obra'}
  else if(a=='pub'){const r=ready();if(!(r.a&&r.b&&r.c)){toast('Completa la descripción, el itemizado y las fotos.');return}S.req='offers';toast('Solicitud publicada. Los maestros ya pueden cotizar.')}
 else if(a=='acc'){S.req='active';S.acc=+v;S.h=[0,0,0,0];S.as={i:{},f:{},h:{}};{const o=offers().find(x=>x.p==+v);S.contract=o?o.t:0;S.plazo=o?o.d:0}toast('Propuesta aceptada. Se abre el contrato por hitos.')}
 else if(a=='rep'){S.h[v]=1;toast('Avance reportado. El cliente debe aprobarlo.')}
 else if(a=='apr'){S.h[v]=2;toast('Hito aprobado y pago liberado.');if(S.h.every(x=>x==2)){S.req='final';toast('Todos los hitos aprobados. Falta la entrega final con asesoría técnica y firma de conformidad.')}}
 else if(a=='rate'){S.rt[b.dataset.w]=+v;toast('Calificación enviada.')}
